<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SmileCare | Doctors</title>

    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <link rel="stylesheet" href="css/all.min.css" />

    <link rel="stylesheet" href="css/global.css" />

    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <link rel="stylesheet" href="css/doctors.css" />
  </head>

  <body>
    <div id="navbarContainer"></div>

    <main class="container pt-5 pb-5 mt-5">
      <section class="text-center mb-5">
        <h1 class="fw-bold fw-bold">Find Your Dentist</h1>

        <p class="text-muted mb-0">
          Search experienced dentists, compare ratings, and book your
          appointment with confidence.
        </p>
      </section>

      <section  class="mb-4">
        <h2 id="filterHeading" class="visually-hidden">
          Doctor Search and Filters
        </h2>

        <div class="row g-3">
          <div class="col-lg-6">
            <label for="searchInput" class="visually-hidden">
              Search by doctor name
            </label>

            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <i
                  class="fa-solid fa-magnifying-glass text-muted"
                >
                </i>
              </span>

              <input
                type="search"
                id="searchInput"
                class="form-control border-start-0"
                placeholder="Search by doctor name..."
              />
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <label for="specializationFilter" class="visually-hidden">
              Filter by specialization
            </label>

            <select id="specializationFilter" class="form-select">
              <option value="">All Specialties</option>

              <option value="Orthodontist">Orthodontist</option>

              <option value="General Dentist">General Dentist</option>

              <option value="Restorative Dentist">Restorative Dentist</option>

              <option value="Endodontist">Endodontist</option>

              <option value="Implantologist">Implantologist</option>

              <option value="Cosmetic Dentist">Cosmetic Dentist</option>

              <option value="Oral Surgeon">Oral Surgeon</option>
            </select>
          </div>

          <div class="col-md-6 col-lg-3">
            <label for="sortDoctors" class="visually-hidden">
              Sort doctors
            </label>

            <select id="sortDoctors" class="form-select">
              <option value="default">Default</option>

              <option value="rating-desc">Highest Rating</option>

              <option value="exp-desc">Most Experienced</option>
            </select>
          </div>
        </div>
      </section>

      <section class="d-flex justify-content-between align-items-center mb-4">
<h5 id="doctorCount"></h5>
        <p id="avgRatingText" class="text-muted mb-0"></p>
      </section>

      <section
        id="loadingState"
        class="text-center py-5"
      >
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden"> Loading... </span>
        </div>

        <p class="mt-3 text-muted">Loading doctors...</p>
      </section>

      <section id="emptyState" class="d-none text-center py-5">
        <i
          class="fa-solid fa-user-doctor fa-3x text-secondary mb-3"
        >
        </i>

        <h4>No Doctors Found</h4>

        <p class="text-muted">Try searching with another name or specialty.</p>
      </section>

      <section id="doctorList" class="row g-4"></section>
    </main>

    <div id="footerContainer"></div>

    <script src="scripts/bootstrap.bundle.min.js"></script>

    <script src="scripts/navbar.js"></script>

    <script src="scripts/doctors.js"></script>
  </body>
</html>
