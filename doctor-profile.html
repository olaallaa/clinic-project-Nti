<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="View doctor profile, qualifications, experience and book an appointment at SmileCare."
    />

    <title>Doctor Profile | SmileCare</title>

    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <link rel="stylesheet" href="css/all.min.css" />

    <link rel="stylesheet" href="css/global.css" />

    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <link rel="stylesheet" href="css/doctor-profile.css" />
  </head>

  <body>
    <div id="navbarContainer"></div>

    <main class="container pt-5 pb-5 mt-5">
      <section id="profileContainer" aria-live="polite">
        <div class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden"> Loading... </span>
          </div>

          <p class="mt-3 text-muted">Loading doctor details...</p>
        </div>
      </section>
    </main>

    <div id="footerContainer"></div>

    <script src="scripts/bootstrap.bundle.min.js"></script>

    <script src="scripts/navbar.js"></script>

    <script src="scripts/doctor-profile.js"></script>
  </body>
</html>
