<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | SmileCare</title>

    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <main
      class="auth-section min-vh-100 d-flex align-items-center justify-content-center"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-5">
            <div class="card shadow border-0 p-4">
              <div class="text-center mb-4">
                <i class="fa-solid fa-tooth text-primary fa-3x mb-3"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Login to your SmileCare account</p>
              </div>

              <form id="loginForm">
                <div class="mb-3">
                  <label for="email" class="form-label"> Email </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fa-regular fa-envelope"></i>
                    </span>

                    <input
                      type="email"
                      id="email"
                      class="form-control"
                      placeholder="Enter your email"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label"> Password </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fa-solid fa-lock"></i>
                    </span>

                    <input
                      type="password"
                      id="password"
                      class="form-control"
                      placeholder="Enter your password"
                      required
                    />

                    <button
                      class="btn btn-outline-secondary"
                      type="button"
                      id="togglePassword"
                    >
                      <i id="toggleIcon" class="fa-solid fa-eye"></i>
                    </button>
                  </div>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-4"
                >
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="rememberMe"
                    />

                    <label class="form-check-label" for="rememberMe">
                      Remember me
                    </label>
                  </div>

                  <a href="#" class="text-decoration-none">
                    Forgot Password?
                  </a>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Login
                </button>

                <p class="text-center mt-4 mb-0">
                  Don't have an account?

                  <a href="register.html" class="text-decoration-none fw-bold">
                    Register
                  </a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>
    <script src="scripts/login.js"></script>
  </body>
</html>
